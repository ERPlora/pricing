[package]
name = "pricing-handler"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
guest = ["dep:extism-pdk"]

[dependencies]
# Contrato host↔guest del Tier 2 (Input/Output/Operation/Event). El path apunta al
# crate del workspace del Hub (hub/crates/guest-sdk), igual que el resto de handlers.
erplora-guest-sdk = { path = "../../../../hub/crates/guest-sdk" }
extism-pdk = { version = "1", optional = true }
# Aritmética decimal EXACTA (WASM-TODO.md §5): nunca f64 para importes, para que el
# resultado coincida byte a byte entre single (SQLite) y cloud (Postgres).
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"

[workspace]
